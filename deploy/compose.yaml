name: chatgpt-ceo
services:
  server:
    image: ${CEO_IMAGE:?Set the reviewed immutable image ID or digest}
    env_file:
      - ${CEO_ENV_FILE:?Set the private server environment file}
    environment:
      NODE_ENV: production
      PORT: '3000'
      CONFIG_PATH: /data/config.json
    networks: [shared]
    ports:
      - 127.0.0.1:${CEO_PORT:?Select an unused loopback port}:3000
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
volumes:
  data:

networks:
  shared:
    external: true
    name: ${CEO_NETWORK:-aluno-expert-net}
